name: ci

on:
  push:
    # plan/** is for land (meta J240, J290): land waits on this exact SHA's
    # run. This workflow only checks; the site deploys from site-deploy.yml,
    # which runs on main only.
    branches: [main, 'plan/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a plan branch cancels its older run; land reads a
  # cancelled run as red and stops, so push a plan branch only via land.
  cancel-in-progress: true

jobs:
  # One job (meta TEST-SPEED TS16g): check and e2e each took under a
  # minute, so a second job only paid setup, install and a runner twice.
  check:
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Private org git dependencies (github:project-wildshard/...): mint a
      # read-only token from the org app (meta repo P0.2, J34) and point
      # every github.com URL form at it. pnpm-lock.yaml records them as
      # git@github.com:..., and git clones them, so the rewrite covers it.
      # Skipped where the secrets don't reach (fork PRs, Dependabot).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      # The agent hook scripts are shellchecked in pnpm check, at this exact
      # version (.agents/hooks/test/shellcheck.test.mjs refuses any other on CI).
      # MR6: hosted runners are Linux/X64, the Mac mini's VM is Linux/ARM64;
      # each archive is pinned by its own published sha256.
      - name: Install shellcheck 0.11.0
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) arch=x86_64 sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            Linux/ARM64) arch=aarch64 sum=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
            *) echo "::error::no pinned shellcheck 0.11.0 for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          echo "$sum  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: pnpm check
      - run: pnpm test:hooks
      # Tests can't reach another repo, so CI holds this gate: api-server must
      # refuse the cells the form doesn't offer (docs/dev.md).
      - name: api-server has the form's grid
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/project-wildshard/api-server/contents/src/server/routes/waitlist-grid.json \
            -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/waitlist-grid.json"
          pnpm site:api-grid "$RUNNER_TEMP/waitlist-grid.json"
      # The site's build is its test: it stops on a broken slot, fact or page.
      - run: pnpm site:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: src/e2e/test-results/
          retention-days: 7
