name: site-deploy

# The marketing site (MARKETING-SITE MS10, E465) redeploys itself whenever src/site/ changes (src/site/COPY.md is Jake's
# copy). It uploads to the Vercel project wildshard-site, which has no Git link and owns the domains.
on:
  push:
    branches: [main]
    paths:
      - 'src/site/**'
      - '.github/workflows/site-deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: site-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # `@wildshard/format` is a private dev dependency, for `pnpm site:facts`.
      # The site's build never reads it, but the install fetches it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@59.11.2
      - name: Deploy the site
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: |
          test -n "$VERCEL_BUILD_TOKEN" || { echo '::error::Missing VERCEL_BUILD_TOKEN'; exit 1; }
          bash src/site/tools/deploy.sh
      # Every deployment is a full copy billed as storage and Vercel's retention does not clear them
      # (meta VERCEL-SPEND-PLAN). Keeps live, aliased and the newest two; cleanup only warns.
      - name: Prune superseded deployments
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VERCEL_BUILD_TOKEN: ${{ secrets.VERCEL_BUILD_TOKEN }}
        run: node scripts/prune-deployments.mjs --project wildshard-site --keep 2
